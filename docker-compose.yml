services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    volumes:
      - ./backend/main.py:/app/main.py
      - ./backend/compile.py:/app/compile.py
      - arduino-core:/root/.arduino15
      - arduino-libs:/root/Arduino
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  arduino-core:
  arduino-libs: